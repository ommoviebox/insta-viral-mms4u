
<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080808">
<title>Admin Panel - Insta Viral MMS4u</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:18px auto}
.panel{background:#171717;border:1px solid #333;border-radius:14px;padding:18px;margin-bottom:16px}
h1{text-align:center;font-size:25px;margin:4px 0 22px}
h2{font-size:20px;margin:4px 0 16px}
label{display:block;font-size:14px;margin:12px 0 6px;color:#ddd}
input,textarea,select,button{width:100%;padding:12px;border-radius:8px;font-size:15px}
input,textarea,select{background:#090909;color:#fff;border:1px solid #444}
textarea{min-height:90px;resize:vertical}
button{border:0;background:#e91e63;color:#fff;font-weight:bold;cursor:pointer;margin-top:12px}
button.secondary{background:#333}
button.danger{background:#b3261e}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none!important}
.muted{color:#aaa;font-size:13px;line-height:1.5}
.status{overflow-wrap:anywhere;line-height:1.5}
.video-item{padding:12px 0;border-top:1px solid #333}
.video-item strong{display:block;margin-bottom:5px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{margin-top:8px}
@media(max-width:480px){.grid{grid-template-columns:1fr}.panel{padding:14px}body{padding:10px}}
</style>
</head>
<body>
<div class="wrap">
<section class="panel">
<h1>Insta Viral MMS4u</h1>
<div id="loginBox">
<h2>Admin Login</h2>
<form id="loginForm">
<label for="email">Admin Email</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Login</button>
</form>
</div>
<p id="status" class="status" role="status"></p>
<div id="dashboard" class="hidden">
<p class="muted">Logged in as authorized admin.</p>
<button id="logoutBtn" class="secondary" type="button">Logout</button>
</div>
</section>

<section id="editorPanel" class="panel hidden">
<h2 id="formHeading">Add Video</h2>
<form id="videoForm">
<input type="hidden" id="docId">
<label for="title">Video Title *</label>
<input id="title" required maxlength="180" placeholder="Video title">
<div class="grid">
<div><label for="year">Year</label><input id="year" maxlength="10" placeholder="2026"></div>
<div><label for="language">Language</label><input id="language" placeholder="Hindi"></div>
</div>
<div class="grid">
<div><label for="type">Type</label>
<select id="type"><option>Video</option><option>Web Series</option><option>Short Film</option></select></div>
<div><label for="category">Category</label><input id="category" placeholder="Instagram Viral Video"></div>
</div>
<label for="genre">Genre</label><input id="genre" placeholder="Viral Video">
<label for="poster">Poster URL</label><input id="poster" type="url" placeholder="https://...">
<label for="screenshots">Screenshot URLs (one URL per line)</label>
<textarea id="screenshots" placeholder="https://...&#10;https://..."></textarea>
<label for="description">Description</label><textarea id="description" placeholder="Video description"></textarea>
<label for="watchLink">Authorized Watch URL</label><input id="watchLink" type="url" placeholder="https://...">
<label for="downloadLink">Authorized Download URL</label><input id="downloadLink" type="url" placeholder="https://...">
<label for="published">Publish status</label>
<select id="published"><option value="true">Published</option><option value="false">Unpublished</option></select>
<button type="submit" id="saveBtn">Save Video</button>
<button type="button" id="cancelEdit" class="secondary hidden">Cancel Edit</button>
</form>
</section>

<section id="listPanel" class="panel hidden">
<h2>Saved Videos</h2>
<button id="refreshBtn" class="secondary" type="button">Refresh List</button>
<div id="videoList"><p class="muted">No videos loaded yet.</p></div>
</section>
</div>

<script type="module">
import { auth, db } from "./firebase-config.js";
import {
signInWithEmailAndPassword, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
collection, getDocs, addDoc, updateDoc, deleteDoc, doc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN_UID = "087LxEZu6ZVJF8xvJcJEMiEAVoq2";
const $ = (id) => document.getElementById(id);
let activeUser = null;
let videosCache = [];

function message(text){$("status").textContent=text}
function adminAllowed(user){return Boolean(user && user.uid===ADMIN_UID)}

$("loginForm").addEventListener("submit",async(event)=>{
event.preventDefault();
message("Logging in...");
try{
await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);
}catch(error){
message("Login failed. Email/password check karein. ("+error.code+")");
}
});

onAuthStateChanged(auth,async(user)=>{
activeUser=user;
if(!user){
$("loginBox").classList.remove("hidden");
$("dashboard").classList.add("hidden");
$("editorPanel").classList.add("hidden");
$("listPanel").classList.add("hidden");
return;
}
if(!adminAllowed(user)){
message("Access denied: ye account authorized admin nahi hai.");
await signOut(auth);
return;
}
$("loginBox").classList.add("hidden");
$("dashboard").classList.remove("hidden");
$("editorPanel").classList.remove("hidden");
$("listPanel").classList.remove("hidden");
message("Admin login successful.");
await loadVideos();
});

$("logoutBtn").addEventListener("click",async()=>{
await signOut(auth);
message("Logged out.");
});

function clearForm(){
$("videoForm").reset();
$("docId").value="";
$("formHeading").textContent="Add Video";
$("saveBtn").textContent="Save Video";
$("cancelEdit").classList.add("hidden");
}
$("cancelEdit").addEventListener("click",clearForm);

$("videoForm").addEventListener("submit",async(event)=>{
event.preventDefault();
if(!adminAllowed(activeUser)){message("Access denied.");return}
const data={
title:$("title").value.trim(),
year:$("year").value.trim(),
language:$("language").value.trim(),
type:$("type").value,
category:$("category").value.trim(),
genre:$("genre").value.trim(),
poster:$("poster").value.trim(),
screenshots:$("screenshots").value.split(/\r?\n/).map(v=>v.trim()).filter(Boolean),
description:$("description").value.trim(),
watchLink:$("watchLink").value.trim(),
downloadLink:$("downloadLink").value.trim(),
published:$("published").value==="true",
updatedAt:serverTimestamp()
};
try{
const id=$("docId").value;
if(id){
await updateDoc(doc(db,"videos",id),data);
message("Video updated successfully.");
}else{
data.createdAt=serverTimestamp();
await addDoc(collection(db,"videos"),data);
message("Video saved successfully.");
}
clearForm();
await loadVideos();
}catch(error){
message("Save error: "+error.code+". Firestore Rules/connection check karein.");
}
});

async function loadVideos(){
if(!adminAllowed(activeUser))return;
$("videoList").textContent="Loading...";
try{
const snap=await getDocs(collection(db,"videos"));
videosCache=snap.docs.map(item=>({id:item.id,...item.data()}));
videosCache.sort((a,b)=>(b.updatedAt?.seconds||b.createdAt?.seconds||0)-(a.updatedAt?.seconds||a.createdAt?.seconds||0));
renderVideos();
}catch(error){
$("videoList").textContent="Load error: "+error.code+". Firestore Rules check karein.";
}
}

function renderVideos(){
const list=$("videoList");
list.replaceChildren();
if(!videosCache.length){
const p=document.createElement("p");
p.className="muted";
p.textContent="Abhi Firestore ke videos collection mein koi video nahi hai.";
list.append(p);
return;
}
for(const item of videosCache){
const card=document.createElement("div");
card.className="video-item";
const title=document.createElement("strong");
title.textContent=item.title||"Untitled video";
const info=document.createElement("p");
info.className="muted";
info.textContent=(item.category||"No category")+" • "+(item.published?"Published":"Unpublished");
const actions=document.createElement("div");
actions.className="actions";
const edit=document.createElement("button");
edit.type="button";edit.className="secondary";edit.textContent="Edit";
edit.addEventListener("click",()=>fillForm(item));
const remove=document.createElement("button");
remove.type="button";remove.className="danger";remove.textContent="Delete";
remove.addEventListener("click",async()=>{
if(!adminAllowed(activeUser)||!confirm('Delete "'+(item.title||"this video")+'"?'))return;
try{
await deleteDoc(doc(db,"videos",item.id));
message("Video deleted.");
await loadVideos();
}catch(error){message("Delete error: "+error.code)}
});
actions.append(edit,remove);
card.append(title,info,actions);
list.append(card);
}
}

function fillForm(item){
$("docId").value=item.id;
for(const field of ["title","year","language","type","category","genre","poster","description","watchLink","downloadLink"]){
$(field).value=item[field]||"";
}
$("screenshots").value=Array.isArray(item.screenshots)?item.screenshots.join("\n"):"";
$("published").value=item.published===false?"false":"true";
$("formHeading").textContent="Edit Video";
$("saveBtn").textContent="Update Video";
$("cancelEdit").classList.remove("hidden");
window.scrollTo({top:0,behavior:"smooth"});
}
$("refreshBtn").addEventListener("click",loadVideos);
</script>
</body>
</html>
