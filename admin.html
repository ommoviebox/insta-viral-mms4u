<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin Panel - Insta Viral MMS4u</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #080808;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .panel {
      max-width: 520px;
      margin: 30px auto;
      padding: 22px;
      background: #171717;
      border: 1px solid #333;
      border-radius: 14px;
    }
    h2 { text-align: center; }
    input, textarea, select, button {
      display: block;
      width: 100%;
      margin: 12px 0;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      font-size: 15px;
    }
    input, textarea, select {
      background: #090909;
      color: white;
    }
    button {
      background: #e91e63;
      color: white;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    #status { overflow-wrap: anywhere; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main class="panel">
    <h2>Insta Viral MMS4u</h2>
    <h3>Admin Login</h3>

    <form id="loginForm">
      <input id="email" type="email" placeholder="Admin Email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>

    <p id="status" role="status"></p>

    <section id="dashboard" class="hidden">
      <h3>Video Manager</h3>
      <p>Login successful. Video manager setup is the next step.</p>
      <button id="logoutBtn" type="button">Logout</button>
    </section>
  </main>

  <script type="module">
    import { auth } from "./firebase-config.js";
    import {
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const loginForm = document.getElementById("loginForm");
    const status = document.getElementById("status");
    const dashboard = document.getElementById("dashboard");
    const logoutBtn = document.getElementById("logoutBtn");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      status.textContent = "Logging in...";
      try {
        await signInWithEmailAndPassword(
          auth,
          document.getElementById("email").value.trim(),
          document.getElementById("password").value
        );
        status.textContent = "";
      } catch (error) {
        status.textContent = "Login failed. Check your email and password.";
      }
    });

    onAuthStateChanged(auth, (user) => {
      const loggedIn = Boolean(user);
      loginForm.classList.toggle("hidden", loggedIn);
      dashboard.classList.toggle("hidden", !loggedIn);
    });

    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      status.textContent = "Logged out.";
    });
  </script>
</body>
</html>
