
<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Panel - Insta Viral MMS4u</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:16px;background:#080808;color:#f5f5f5;font-family:Arial,sans-serif}
.wrap{max-width:760px;margin:18px auto}
.panel{background:#171717;border:1px solid #333;border-radius:14px;padding:18px;margin-bottom:16px}
h1{text-align:center;font-size:25px}
label{display:block;font-size:14px;margin:12px 0 6px;color:#ddd}
input,textarea,select,button{width:100%;padding:12px;border-radius:8px;font-size:15px}
input,textarea,select{background:#090909;color:#fff;border:1px solid #444}
textarea{min-height:90px}
button{border:0;background:#e91e63;color:white;font-weight:bold;cursor:pointer;margin-top:12px}
button.secondary{background:#333}
button.danger{background:#b3261e}
.hidden{display:none!important}
.muted{color:#aaa;font-size:13px;line-height:1.5}
.status{overflow-wrap:anywhere}
.video-item,.button-row{padding:12px 0;border-top:1px solid #333}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.panel{padding:14px}body{padding:10px}}
</style>
</head>
<body>
<div class="wrap">

<section class="panel">
<h1>Insta Viral MMS4u</h1>
<div id="loginBox">
<h2>Admin Login</h2>
<form id="loginForm">
<label>Admin Email</label>
<input id="email" type="email" autocomplete="username" required>
<label>Password</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit">Login</button>
</form>
</div>
<p id="status" class="status" role="status"></p>
<div id="dashboard" class="hidden">
<p class="muted">Authorized admin session active.</p>
<button id="logoutBtn" class="secondary" type="button">Logout</button>
</div>
</section>

<section id="editorPanel" class="panel hidden">
<h2 id="formHeading">Add Video</h2>
<form id="videoForm">
<input type="hidden" id="docId">

<label>Video Title *</label>
<input id="title" required maxlength="180">

<label>Category *</label>
<select id="category" required>
<option value="">Select Category</option>
<option>Instagram Viral Video</option>
<option>Hindi Video</option>
<option>English Video</option>
<option>Tamil Video</option>
<option>Telugu Video</option>
<option>Malayalam Video</option>
<option>Web Series</option>
<option>Short Film</option>
<option value="__custom">+ Add Custom Category</option>
</select>

<div id="customCategoryWrap" class="hidden">
<label>Custom Category Name</label>
<input id="customCategory" placeholder="Enter category name">
</div>

<label>Type</label>
<select id="type">
<option>Video</option>
<option>Web Series</option>
<option>Short Film</option>
</select>

<label>Genre</label>
<input id="genre" placeholder="Viral Video">

<label>Poster URL</label>
<input id="poster" type="url" placeholder="https://...">

<label>Screenshot URLs (one URL per line)</label>
<textarea id="screenshots" placeholder="https://..."></textarea>

<label>Description</label>
<textarea id="description"></textarea>

<h3>Watch / Download / Custom Buttons</h3>
<p class="muted">हर बटन का नाम और लिंक लिखें। ज़रूरत के अनुसार कई बटन जोड़ें।</p>
<div id="buttonsContainer"></div>
<button type="button" id="addButton" class="secondary">+ Add Button</button>

<label>Publish Status</label>
<select id="published">
<option value="true">Published</option>
<option value="false">Unpublished</option>
</select>

<button type="submit" id="saveBtn">Save Video</button>
<button type="button" id="cancelEdit" class="secondary hidden">Cancel Edit</button>
</form>
</section>

<section id="listPanel" class="panel hidden">
<h2>Saved Videos</h2>
<button id="refreshBtn" class="secondary" type="button">Refresh List</button>
<div id="videoList"></div>
</section>
</div>

<script type="module">
import {auth,db} from "./firebase-config.js";
import {
signInWithEmailAndPassword,signOut,onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
collection,getDocs,addDoc,updateDoc,deleteDoc,doc,serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN_UID="087LxEZu6ZVJF8xvJcJEMiEAVoq2";
const $=id=>document.getElementById(id);
let activeUser=null,videosCache=[];

const allowed=u=>Boolean(u&&u.uid===ADMIN_UID);
const msg=t=>$("status").textContent=t;

function addButtonRow(label="",url=""){
const row=document.createElement("div");
row.className="button-row";
const nl=document.createElement("label");
nl.textContent="Button Name";
const n=document.createElement("input");
n.className="btn-name";
n.placeholder="Online Watch / Download 720p";
n.value=label;
n.required=true;
const ul=document.createElement("label");
ul.textContent="Button URL";
const l=document.createElement("input");
l.type="url";
l.className="btn-url";
l.placeholder="https://...";
l.value=url;
l.required=true;
const r=document.createElement("button");
r.type="button";
r.className="danger";
r.textContent="Remove Button";
r.onclick=()=>row.remove();
row.append(nl,n,ul,l,r);
$("buttonsContainer").append(row);
}

function setButtons(items){
$("buttonsContainer").replaceChildren();
if(items&&items.length){
items.forEach(x=>addButtonRow(x.label||x.name||"",x.url||x.link||""));
}else{
addButtonRow("Online Watch","");
addButtonRow("Download","");
}
}

function readButtons(){
return [...$("buttonsContainer").querySelectorAll(".button-row")]
.map(r=>({
label:r.querySelector(".btn-name").value.trim(),
url:r.querySelector(".btn-url").value.trim()
}))
.filter(x=>x.label&&x.url);
}

$("addButton").onclick=()=>addButtonRow();

$("category").onchange=()=>{
$("customCategoryWrap").classList.toggle(
"hidden",$("category").value!=="__custom"
);
};

$("loginForm").onsubmit=async e=>{
e.preventDefault();
msg("Logging in...");
try{
await signInWithEmailAndPassword(
auth,$("email").value.trim(),$("password").value
);
}catch(err){
msg("Login failed: "+err.code);
}
};

onAuthStateChanged(auth,async u=>{
activeUser=u;
if(!u){
$("loginBox").classList.remove("hidden");
$("dashboard").classList.add("hidden");
$("editorPanel").classList.add("hidden");
$("listPanel").classList.add("hidden");
return;
}
if(!allowed(u)){
msg("Access denied: this is not the authorized admin account.");
await signOut(auth);
return;
}
$("loginBox").classList.add("hidden");
$("dashboard").classList.remove("hidden");
$("editorPanel").classList.remove("hidden");
$("listPanel").classList.remove("hidden");
msg("Admin login successful.");
await loadVideos();
});

$("logoutBtn").onclick=async()=>{
await signOut(auth);
msg("Logged out");
};

function clearForm(){
$("videoForm").reset();
$("docId").value="";
$("formHeading").textContent="Add Video";
$("saveBtn").textContent="Save Video";
$("cancelEdit").classList.add("hidden");
$("customCategoryWrap").classList.add("hidden");
setButtons([]);
}
$("cancelEdit").onclick=clearForm;

$("videoForm").onsubmit=async e=>{
e.preventDefault();
if(!allowed(activeUser)){
msg("Access denied");
return;
}

let category=$("category").value;
if(category==="__custom"){
category=$("customCategory").value.trim();
}
if(!category){
msg("Select or enter a category");
return;
}

const data={
title:$("title").value.trim(),
category,
type:$("type").value,
genre:$("genre").value.trim(),
poster:$("poster").value.trim(),
screenshots:$("screenshots").value
.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),
description:$("description").value.trim(),
buttons:readButtons(),
published:$("published").value==="true",
updatedAt:serverTimestamp()
};

try{
const id=$("docId").value;
if(id){
await updateDoc(doc(db,"videos",id),data);
msg("Video updated");
}else{
data.createdAt=serverTimestamp();
await addDoc(collection(db,"videos"),data);
msg("Video saved");
}
clearForm();
await loadVideos();
}catch(err){
msg("Save error: "+err.code+". Firestore Rules check karein");
}
};

async function loadVideos(){
if(!allowed(activeUser))return;
$("videoList").textContent="Loading...";
try{
const s=await getDocs(collection(db,"videos"));
videosCache=s.docs.map(x=>({id:x.id,...x.data()}));
videosCache.sort((a,b)=>
(b.updatedAt?.seconds||b.createdAt?.seconds||0)-
(a.updatedAt?.seconds||a.createdAt?.seconds||0)
);
render();
}catch(err){
$("videoList").textContent="Load error: "+err.code+". Firestore Rules check karein";
}
}

function render(){
const list=$("videoList");
list.replaceChildren();
if(!videosCache.length){
list.textContent="No videos found in Firestore videos collection.";
return;
}
for(const v of videosCache){
const box=document.createElement("div");
box.className="video-item";
const title=document.createElement("strong");
title.textContent=v.title||"Untitled";
const info=document.createElement("p");
info.className="muted";
info.textContent=(v.category||"No category")+" • "+(v.published?"Published":"Unpublished");
const acts=document.createElement("div");
acts.className="actions";
const edit=document.createElement("button");
edit.type="button";
edit.className="secondary";
edit.textContent="Edit";
edit.onclick=()=>fill(v);
const del=document.createElement("button");
del.type="button";
del.className="danger";
del.textContent="Delete";
del.onclick=async()=>{
if(!allowed(activeUser)||!confirm("Delete this video?"))return;
try{
await deleteDoc(doc(db,"videos",v.id));
msg("Video deleted");
await loadVideos();
}catch(err){
msg("Delete error: "+err.code);
}
};
acts.append(edit,del);
box.append(title,info,acts);
list.append(box);
}
}

function fill(v){
$("docId").value=v.id;
for(const f of ["title","type","genre","poster","description"]){
$(f).value=v[f]||"";
}
const opts=[...$("category").options].map(o=>o.value);
if(opts.includes(v.category)&&v.category!=="__custom"){
$("category").value=v.category;
$("customCategoryWrap").classList.add("hidden");
}else{
$("category").value="__custom";
$("customCategoryWrap").classList.remove("hidden");
$("customCategory").value=v.category||"";
}
$("screenshots").value=Array.isArray(v.screenshots)?v.screenshots.join("\n"):"";
$("published").value=v.published===false?"false":"true";
setButtons(v.buttons||[
...(v.watchLink?[{label:"Online Watch",url:v.watchLink}]:[]),
...(v.downloadLink?[{label:"Download",url:v.downloadLink}]:[])
]);
$("formHeading").textContent="Edit Video";
$("saveBtn").textContent="Update Video";
$("cancelEdit").classList.remove("hidden");
window.scrollTo({top:0,behavior:"smooth"});
}

$("refreshBtn").onclick=loadVideos;
setButtons([]);
</script>
</body>
</html>
