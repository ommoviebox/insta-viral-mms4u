
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000">

  <title>Video Details - Insta Viral MMS4u</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      background: #000;
      min-height: 100%;
    }

    body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      background: #000 !important;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    /* HEADER */
    header {
      width: 100%;
      text-align: center;
    }

    header .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
    }

    .video-logo {
      display: block;
      width: min(90%, 380px);
      max-height: 110px;
      object-fit: contain;
    }

    /* HOME AND TELEGRAM BUTTONS */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      padding: 10px 16px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #c6ff00;
      color: #000;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 900;
    }

    .telegram {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 11px 18px;
      border-radius: 50px;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
    }

    /* MAIN CONTENT */
    .detail-page {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 12px 18px 24px;
    }

    /* POSTER AND TITLE */
    .detail-hero {
      display: grid;
      grid-template-columns: minmax(100px, 24%) minmax(0, 1fr);
      align-items: center;
      gap: 16px;
      padding: 16px;
      margin: 10px 0 16px;
      background: #142037;
      border: 1px solid #263653;
      border-radius: 18px;
    }

    .detail-poster {
      display: block;
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      background: #151515;
      border-radius: 10px;
    }

    .poster-placeholder {
      display: grid;
      place-items: center;
      color: #777;
      font-size: 24px;
      font-weight: 900;
    }

    .detail-title {
      margin: 0;
      color: #f5f6fb;
      font-family: Arial, Helvetica, sans-serif;
      font-size: clamp(17px, 2.4vw, 24px);
      font-weight: 700;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    /* VIDEO INFORMATION */
    .info-stack {
      display: grid;
      gap: 7px;
      width: 100%;
    }

    .info-card {
      width: 100%;
      padding: 11px 13px;
      background: #142037;
      border: 1px solid #263653;
      border-radius: 11px;
      color: #f5f6fb;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .info-card strong {
      color: #8998b2;
      font-size: 11px;
      font-weight: 800;
    }

    /* SECTION HEADINGS */
    .section-title {
      width: 100%;
      margin: 20px 0 12px;
      padding: 14px 8px;
      text-align: center;
      background: #0d1523;
      color: #f5f6fb;
      font-size: 22px;
      font-weight: 900;
    }

    /* SCREENSHOTS */
    .screenshots {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 7px;
      width: 100%;
      max-width: 100%;
      margin: 0 auto 22px;
      padding: 0;
      align-items: start;
    }

    .screenshots img {
      display: block;
      width: 100%;
      max-width: 100%;
      height: auto;
      min-width: 0;
      border: 1px solid #fff;
      border-radius: 4px;
      background: #151515;
      object-fit: contain;
    }

    .screenshots .notice {
      padding: 0 10px;
    }

    /* DOWNLOAD AND WATCH BUTTONS */
    .detail-buttons {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 8px;
      width: 100%;
      max-width: 500px;
      margin: 14px auto 24px;
    }

    .detail-button {
      display: block;
      width: 100%;
      min-height: 44px;
      padding: 12px 10px;
      border-radius: 7px;
      color: #fff;
      text-align: center;
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .download-button {
      background: #19b86b;
    }

    .watch-button {
      background: #ff9800;
    }

    /* FOOTER */
    .notice {
      color: #aaa;
      line-height: 1.6;
    }

    footer {
      width: 100%;
      padding: 16px 12px;
      background: #000;
      color: #888;
      text-align: center;
      font-size: 12px;
    }

    /* DESKTOP AND LAPTOP */
    @media (min-width: 768px) {
      .video-logo {
        width: 380px;
        max-height: 110px;
      }

      .detail-page {
        max-width: 760px;
        padding: 12px 18px 28px;
      }

      .detail-hero {
        grid-template-columns: 180px minmax(0, 1fr);
        gap: 20px;
        padding: 18px;
        border-radius: 18px;
      }

      .detail-title {
        font-size: 24px;
      }

      .info-card {
        padding: 11px 13px;
        font-size: 13px;
      }

      .section-title {
        font-size: 24px;
        margin-top: 22px;
      }

      /* One large screenshot in each row */
      .screenshots {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
        width: 100%;
        max-width: 100%;
      }

      .screenshots img {
        width: 100%;
        height: auto;
      }

      .detail-buttons {
        max-width: 500px;
        gap: 8px;
      }

      .detail-button {
        min-height: 46px;
        font-size: 15px;
      }
    }

    /* SMALL SCREENS */
    @media (max-width: 480px) {
      .video-logo {
        width: min(90%, 350px);
        max-height: 95px;
      }

      .actions {
        gap: 8px;
        padding: 8px 10px;
      }

      .back-button,
      .telegram {
        padding: 10px 14px;
        font-size: 12px;
      }

      .detail-page {
        padding: 8px 10px 20px;
      }

      .detail-hero {
        grid-template-columns: minmax(95px, 30%) minmax(0, 1fr);
        gap: 10px;
        padding: 10px;
        margin: 8px 0 12px;
        border-radius: 15px;
      }

      .detail-poster {
        border-radius: 8px;
      }

      .detail-title {
        font-size: 16px;
        line-height: 1.4;
      }

      .info-stack {
        gap: 6px;
      }

      .info-card {
        padding: 9px 10px;
        border-radius: 10px;
        font-size: 12px;
        line-height: 1.5;
      }

      .info-card strong {
        font-size: 10px;
      }

      .section-title {
        margin: 18px 0 10px;
        padding: 13px 6px;
        font-size: 20px;
      }

      .screenshots {
        grid-template-columns: minmax(0, 1fr);
        width: 100%;
        gap: 6px;
        margin: 0 auto 18px;
      }

      .screenshots img {
        width: 100%;
        height: auto;
        border-radius: 3px;
      }

      .detail-buttons {
        width: 100%;
        max-width: 100%;
        gap: 7px;
        margin: 12px auto 20px;
      }

      .detail-button {
        min-height: 42px;
        padding: 11px 8px;
        font-size: 14px;
        border-radius: 7px;
      }

      footer {
        font-size: 11px;
      }
    }
  </style>
</head>

<body>

<header>
  <a class="brand" href="index.html" aria-label="Home">
    <video class="video-logo" autoplay muted loop playsinline preload="auto">
      <source src="./Logo.mp4" type="video/mp4">
    </video>
  </a>
</header>

<div class="actions">
  <a class="back-button" href="index.html">← HOME</a>

  <a class="telegram"
     href="https://t.me/"
     target="_blank"
     rel="noopener noreferrer">
    ✈ JOIN TELEGRAM
  </a>
</div>

<main class="detail-page" id="details">
  <p class="notice">Loading video details...</p>
</main>

<footer>
  Insta Viral MMS4u · Entertainment information and authorized links
</footer>

<script type="module">
  import { videos as localVideos } from "./videos.js";
  import { db } from "./firebase-config.js";

  import {
    doc,
    getDoc
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const params = new URLSearchParams(location.search);
  const rawId = params.get("id");
  const source = params.get("source");
  const root = document.getElementById("details");

  function addText(tag, className, text) {
    const element = document.createElement(tag);
    element.className = className || "";
    element.textContent = text || "";
    return element;
  }

  function validLink(value) {
    try {
      const url = new URL(value, location.href);

      return ["http:", "https:"].includes(url.protocol)
        ? url.href
        : "";
    } catch {
      return "";
    }
  }

  function showError(message) {
    const heading = addText(
      "h2",
      "section-title",
      "Video not found"
    );

    const text = addText("p", "notice", message);

    const back = addText(
      "a",
      "back-button",
      "← Back to Home"
    );

    back.href = "index.html";

    root.replaceChildren(heading, text, back);
  }

  function renderVideo(video) {
    if (!video) {
      showError(
        "Please return to the home page and select a video."
      );
      return;
    }

    document.title =
      (video.title || "Video Details") +
      " - Insta Viral MMS4u";

    const hero = document.createElement("section");
    hero.className = "detail-hero";

    let poster;

    if (video.poster) {
      poster = document.createElement("img");
      poster.className = "detail-poster";
      poster.src = video.poster;
      poster.alt = video.title || "Video poster";
    } else {
      poster = addText(
        "div",
        "detail-poster poster-placeholder",
        "IV"
      );
    }

    const title = addText(
      "h1",
      "detail-title",
      video.title || "Untitled Video"
    );

    hero.append(poster, title);

    const infoStack = document.createElement("section");
    infoStack.className = "info-stack";

    function addInfo(label, value) {
      const card = document.createElement("div");
      card.className = "info-card";

      card.append(
        addText("strong", "", label + ": "),
        document.createTextNode(value || "—")
      );

      infoStack.appendChild(card);
    }

    addInfo("NAME", video.title);
    addInfo("GENRE", video.genre || video.category);

    if (video.year) {
      addInfo("RELEASE YEAR", String(video.year));
    }

    if (video.language) {
      addInfo("LANGUAGE", video.language);
    }

    if (video.description) {
      addInfo("DESCRIPTION", video.description);
    }

    const screenshotTitle = addText(
      "h2",
      "section-title",
      "▱ Screenshots ▱"
    );

    const screenshots = document.createElement("div");
    screenshots.className = "screenshots";

    const screenshotList = Array.isArray(video.screenshots)
      ? video.screenshots
      : [];

    screenshotList.filter(Boolean).forEach(src => {
      const image = document.createElement("img");

      image.src = src;
      image.alt = "Video screenshot";
      image.loading = "lazy";

      screenshots.appendChild(image);
    });

    if (!screenshots.children.length) {
      screenshots.appendChild(
        addText("p", "notice", "No screenshots added yet.")
      );
    }

    const linksTitle = addText(
      "h2",
      "section-title",
      "Download Links 👇"
    );

    const buttons = document.createElement("div");
    buttons.className = "detail-buttons";

    const customButtons = Array.isArray(video.buttons)
      ? video.buttons
      : [];

    customButtons.forEach(item => {
      const url = validLink(item && item.url);

      if (!url) return;

      const label = String(
        item.label || "OPEN LINK"
      ).trim();

      const link = addText(
        "a",
        "detail-button download-button",
        label
      );

      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      buttons.appendChild(link);
    });

    if (!customButtons.length) {
      const download = validLink(video.downloadLink);
      const watch = validLink(video.watchLink);

      if (download) {
        const link = addText(
          "a",
          "detail-button download-button",
          "⬇ DOWNLOAD"
        );

        link.href = download;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        buttons.appendChild(link);
      }

      if (watch) {
        const link = addText(
          "a",
          "detail-button watch-button",
          "▶ ONLINE WATCH"
        );

        link.href = watch;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        buttons.appendChild(link);
      }
    }

    if (!buttons.children.length) {
      buttons.appendChild(
        addText("p", "notice", "Links will be added here.")
      );
    }

    const back = addText(
      "a",
      "back-button",
      "← Back to Home"
    );

    back.href = "index.html";

    root.replaceChildren(
      hero,
      infoStack,
      screenshotTitle,
      screenshots,
      linksTitle,
      buttons,
      back
    );
  }

  async function loadVideo() {
    if (!rawId) {
      showError("No video was selected.");
      return;
    }

    if (source === "firebase") {
      try {
        const snapshot = await getDoc(
          doc(db, "videos", rawId)
        );

        if (
          !snapshot.exists() ||
          snapshot.data().published !== true
        ) {
          showError("This video is not available.");
          return;
        }

        renderVideo(snapshot.data());
      } catch (error) {
        console.error("Could not load video:", error);

        showError(
          "Could not load this video. Please try again later."
        );
      }

      return;
    }

    if (!/^\d+$/.test(rawId)) {
      showError("Invalid video link.");
      return;
    }

    renderVideo(localVideos[Number(rawId)]);
  }

  loadVideo();
</script>

</body>
</html>
